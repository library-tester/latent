<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061523">
<title>LATENT</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/combat.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="ground"></div><div id="bloom"></div><div id="wash"></div><div id="grain"></div><div id="flash"></div>
<div id="app">
  <div id="bar">
    <span class="title">LATENT</span>
    <span class="stat hp pill"><b id="s-hp">72/72</b></span>
    <span class="stat gold pill"><b id="s-gold">0</b>g</span>
    <span class="sp"></span>
    <div id="relicbar"></div>
    <button class="tag" id="sndbtn" data-a="snd" style="border:1px solid #3e7ca655;padding:4px 6px;border-radius:2px;display:flex"></button>
    <button class="tag" id="deckbtn" style="border:1px solid #3e7ca655;padding:4px 7px;border-radius:2px">Deck</button>
  </div>
  <div id="scene"></div>
</div>
<div id="fx"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
